<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>MOVE:K — 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f1e8; --panel:#fdfbf6; --ink:#221d15; --muted:#6d6455; --faint:#a69c88;
    --gold:#a67c33; --gold-soft:#c19a55; --line:rgba(34,29,21,.14); --line-strong:rgba(34,29,21,.24);
    --ok:#2e7d46; --danger:#b3402f; --radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--gold)}
  .wrap{max-width:820px;margin:0 auto;padding:26px 18px 120px}
  .brand{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:30px;letter-spacing:.06em;text-transform:uppercase}
  .brand .c{color:var(--gold)}
  .tag{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}

  /* login */
  .login{max-width:360px;margin:14vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 28px;box-shadow:0 20px 50px rgba(34,29,21,.08)}
  .login h1{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700;letter-spacing:.04em;margin-bottom:4px}
  .login p{color:var(--muted);font-size:13.5px;margin-bottom:22px}
  label{display:block;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;margin:14px 0 6px}
  input,textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);border-radius:10px;padding:11px 13px;transition:border-color .2s}
  input:focus,textarea:focus{outline:none;border-color:var(--gold)}
  textarea{resize:vertical;min-height:44px;line-height:1.5}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-weight:600;font-size:14px;border:1px solid transparent;border-radius:999px;padding:12px 22px;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s}
  .btn:active{transform:scale(.98)}
  .btn-gold{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#fff;box-shadow:0 8px 22px rgba(166,124,51,.28)}
  .btn-gold:hover{box-shadow:0 12px 30px rgba(166,124,51,.38)}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
  .full{width:100%;margin-top:20px}
  .msg{font-size:13px;margin-top:14px;min-height:18px}
  .msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}

  /* editor */
  .topbar{position:sticky;top:0;z-index:10;background:rgba(245,241,232,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:-26px -18px 22px;padding:16px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .topbar .sp{flex:1}
  .hint{background:#fff7e6;border:1px solid rgba(166,124,51,.3);color:#7a5a22;font-size:13px;border-radius:10px;padding:12px 14px;margin-bottom:20px}
  details.group{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;background:var(--panel);overflow:hidden}
  details.group>summary{cursor:pointer;list-style:none;padding:16px 18px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px}
  details.group>summary::-webkit-details-marker{display:none}
  details.group>summary::before{content:"▸";color:var(--gold);font-size:12px;transition:transform .2s}
  details.group[open]>summary::before{transform:rotate(90deg)}
  .group-body{padding:4px 18px 18px}
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:4px}
  .field label{display:flex;justify-content:space-between;align-items:baseline}
  .field .key{color:var(--faint);font-weight:400;font-size:10.5px}
  .savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(253,251,246,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:14px;justify-content:flex-end;z-index:20}
  .savebar .status{margin-right:auto;font-size:13px;color:var(--muted)}
  .pw-box{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:16px 18px;margin-top:24px;background:var(--panel)}
  .pw-box h3{font-size:14px;margin-bottom:4px}
  .pw-box p{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>div{flex:1;min-width:180px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <!-- 로그인 -->
  <div id="loginView">
    <div class="login">
      <div class="brand">MOVE<span class="c">:</span>K</div>
      <div class="tag" style="margin-bottom:18px">관리자</div>
      <h1>로그인</h1>
      <p>아이디와 비밀번호를 입력하세요.</p>
      <form id="loginForm">
        <label>아이디</label>
        <input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label>비밀번호</label>
        <input id="pass" type="password" autocomplete="current-password" required>
        <button class="btn btn-gold full" type="submit">로그인</button>
        <div id="loginMsg" class="msg"></div>
      </form>
    </div>
  </div>

  <!-- 편집기 -->
  <div id="editorView" hidden>
    <div class="topbar">
      <div>
        <div class="brand" style="font-size:24px">MOVE<span class="c">:</span>K <span style="font-family:Inter;font-size:13px;color:var(--muted);letter-spacing:0;text-transform:none">관리자</span></div>
      </div>
      <div class="sp"></div>
      <a class="btn btn-ghost" href="/" target="_blank" rel="noopener">사이트 보기 ↗</a>
      <button class="btn btn-ghost" id="logoutBtn" type="button">로그아웃</button>
    </div>

    <div class="hint">✏️ 아래 항목을 고치고 맨 아래 <b>저장</b>을 누르면 사이트에 바로 반영됩니다. 섹션 제목을 눌러 펼치고 접을 수 있어요.</div>

    <div id="fields"></div>

    <div class="pw-box">
      <h3>🔑 비밀번호 변경</h3>
      <p>새 비밀번호로 바꾸려면 입력 후 변경을 누르세요. (4자 이상)</p>
      <div class="row">
        <div>
          <input id="newPass" type="password" placeholder="새 비밀번호" autocomplete="new-password">
        </div>
        <button class="btn btn-ghost" id="pwBtn" type="button">변경</button>
      </div>
      <div id="pwMsg" class="msg"></div>
    </div>
  </div>

</div>

<!-- 저장 바 -->
<div class="savebar" id="saveBar" hidden>
  <div class="status" id="saveStatus"></div>
  <button class="btn btn-ghost" id="reloadBtn" type="button">되돌리기</button>
  <button class="btn btn-gold" id="saveBtn" type="button">저장</button>
</div>

<script>
  const $ = (s)=>document.querySelector(s);
  let TOKEN = sessionStorage.getItem('movek_token') || '';
  let FIELDS = [];   // {key,type,label,group,value}

  // ---- 로그인 ----
  $('#loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const msg = $('#loginMsg'); msg.className='msg'; msg.textContent='확인 중…';
    try{
      const r = await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:$('#user').value.trim(),pass:$('#pass').value})});
      const d = await r.json();
      if(d.ok){ TOKEN=d.token; sessionStorage.setItem('movek_token',TOKEN); msg.textContent=''; enterEditor(); }
      else { msg.className='msg err'; msg.textContent='아이디 또는 비밀번호가 올바르지 않습니다.'; }
    }catch(err){ msg.className='msg err'; msg.textContent='연결 오류. 잠시 후 다시 시도하세요.'; }
  });

  $('#logoutBtn').addEventListener('click',()=>{ sessionStorage.removeItem('movek_token'); location.reload(); });

  // ---- 편집기 진입: 사이트에서 편집 항목 자동 수집 + 저장값 덮어쓰기 ----
  async function enterEditor(){
    $('#loginView').hidden = true;
    $('#editorView').hidden = false;
    $('#saveBar').hidden = false;
    await loadFields();
  }

  async function loadFields(){
    $('#saveStatus').textContent = '불러오는 중…';
    // 1) 사이트 HTML에서 편집 항목 추출
    const html = await (await fetch('/?admin='+Date.now(),{cache:'no-store'})).text();
    const doc = new DOMParser().parseFromString(html,'text/html');
    const els = doc.querySelectorAll('[data-k],[data-kh],[data-klist]');
    // 2) 저장값
    let saved = {};
    try{ saved = await (await fetch('/api/content',{cache:'no-store'})).json(); }catch(e){}
    FIELDS = [];
    els.forEach(el=>{
      let key, type;
      if(el.hasAttribute('data-k')){ key=el.getAttribute('data-k'); type='text'; }
      else if(el.hasAttribute('data-kh')){ key=el.getAttribute('data-kh'); type='html'; }
      else { key=el.getAttribute('data-klist'); type='list'; }
      let def;
      if(type==='text') def=el.textContent.trim();
      else if(type==='html') def=el.innerHTML.trim().replace(/\s+/g,' ');
      else def=[...el.querySelectorAll('li')].map(li=>li.textContent.trim()).join('\n');
      const label = el.getAttribute('data-label') || key;
      const group = el.getAttribute('data-group') || '기타';
      const value = (saved && saved[key]!=null) ? saved[key] : def;
      FIELDS.push({key,type,label,group,value,def});
    });
    renderFields();
    $('#saveStatus').textContent = FIELDS.length + '개 항목';
  }

  function renderFields(){
    const box = $('#fields'); box.innerHTML='';
    const groups=[]; const map={};
    FIELDS.forEach(f=>{ if(!map[f.group]){ map[f.group]=[]; groups.push(f.group); } map[f.group].push(f); });
    groups.forEach((g,gi)=>{
      const det=document.createElement('details'); det.className='group'; if(gi<2) det.open=true;
      const sum=document.createElement('summary'); sum.textContent=g+'  ('+map[g].length+')'; det.appendChild(sum);
      const body=document.createElement('div'); body.className='group-body';
      map[g].forEach(f=>{
        const wrap=document.createElement('div'); wrap.className='field';
        const lab=document.createElement('label');
        lab.innerHTML='<span>'+esc(f.label)+'</span><span class="key">'+esc(f.key)+'</span>';
        const ta=document.createElement('textarea');
        ta.value=f.value;
        ta.rows = (f.type==='list' || String(f.value).length>60) ? Math.min(8, Math.max(2, String(f.value).split('\n').length+1)) : 1;
        ta.dataset.key=f.key;
        ta.addEventListener('input',()=>{ const fld=FIELDS.find(x=>x.key===f.key); if(fld) fld.value=ta.value; markDirty(); });
        wrap.appendChild(lab); wrap.appendChild(ta); body.appendChild(wrap);
      });
      det.appendChild(body); box.appendChild(det);
    });
  }

  let dirty=false;
  function markDirty(){ if(!dirty){ dirty=true; $('#saveStatus').textContent='저장되지 않은 변경 있음'; } }

  // ---- 저장 ----
  $('#saveBtn').addEventListener('click', async ()=>{
    const content={}; FIELDS.forEach(f=>{ content[f.key]=f.value; });
    $('#saveStatus').textContent='저장 중…';
    try{
      const r=await fetch('/api/save',{method:'POST',headers:{'content-type':'application/json','x-auth':TOKEN},body:JSON.stringify({content})});
      if(r.status===401){ alert('세션이 만료됐습니다. 다시 로그인해주세요.'); sessionStorage.removeItem('movek_token'); location.reload(); return; }
      const d=await r.json();
      if(d.ok){ dirty=false; $('#saveStatus').textContent='✓ 저장됨 · 사이트에 반영되었습니다'; }
      else { $('#saveStatus').textContent='저장 실패: '+(d.error||'오류'); }
    }catch(e){ $('#saveStatus').textContent='저장 실패 (연결 오류)'; }
  });

  $('#reloadBtn').addEventListener('click', ()=>{ if(!dirty || confirm('저장하지 않은 변경을 버리고 다시 불러올까요?')) loadFields(); });

  // ---- 비밀번호 변경 ----
  $('#pwBtn').addEventListener('click', async ()=>{
    const np=$('#newPass').value; const msg=$('#pwMsg'); msg.className='msg';
    if(!np || np.length<4){ msg.className='msg err'; msg.textContent='4자 이상 입력하세요.'; return; }
    msg.textContent='변경 중…';
    try{
      const r=await fetch('/api/changepass',{method:'POST',headers:{'content-type':'application/json','x-auth':TOKEN},body:JSON.stringify({newPass:np})});
      const d=await r.json();
      if(d.ok){ TOKEN=d.token; sessionStorage.setItem('movek_token',TOKEN); $('#newPass').value=''; msg.className='msg ok'; msg.textContent='✓ 비밀번호가 변경되었습니다.'; }
      else { msg.className='msg err'; msg.textContent='변경 실패: '+(d.error||'오류'); }
    }catch(e){ msg.className='msg err'; msg.textContent='변경 실패 (연결 오류)'; }
  });

  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // 이미 로그인돼 있으면 바로 편집기
  if(TOKEN){ enterEditor(); }
</script>
</body>
</html>
